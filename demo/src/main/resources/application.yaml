spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${SPRING_APPLICATION_NAME:demo-backend}
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:demo_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${MYSQL_USER:demo_user}
    password: ${MYSQL_PASSWORD:123456789}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:100MB}
      file-size-threshold: ${MULTIPART_FILE_SIZE_THRESHOLD:2MB}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:1800s}
    redis:
      flush-mode: on_save
      namespace: ${SESSION_REDIS_NAMESPACE:demo-backend:session}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:admin}
    password: ${RABBITMQ_DEFAULT_PASS:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3
          multiplier: 2
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
    session:
      timeout: ${SERVER_SESSION_TIMEOUT:30m}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.hoandev.demo: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400}
    reset-token-expiration: ${JWT_RESET_TOKEN_EXPIRATION:900}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default:
      limit: ${RATE_LIMIT_DEFAULT_LIMIT:100}
      duration: ${RATE_LIMIT_DEFAULT_DURATION:60}
    endpoints:
      login:
        limit: ${RATE_LIMIT_LOGIN_LIMIT:5}
        duration: ${RATE_LIMIT_LOGIN_DURATION:300}
      register:
        limit: ${RATE_LIMIT_REGISTER_LIMIT:3}
        duration: ${RATE_LIMIT_REGISTER_DURATION:3600}
      refresh-token:
        limit: ${RATE_LIMIT_REFRESH_TOKEN_LIMIT:10}
        duration: ${RATE_LIMIT_REFRESH_TOKEN_DURATION:60}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket-name: ${MINIO_BUCKET_NAME:demo-storage}
    public-bucket-name: ${MINIO_PUBLIC_BUCKET_NAME:demo-public}
    private-bucket-name: ${MINIO_PRIVATE_BUCKET_NAME:demo-private}
    presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY:3600}

  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:noreply@demo.com}
    from-name: ${EMAIL_FROM_NAME:Demo System}
    max-retry: ${EMAIL_MAX_RETRY:3}
    retry-delay-seconds: ${EMAIL_RETRY_DELAY_SECONDS:60}
    async-by-default: ${EMAIL_ASYNC_BY_DEFAULT:true}
    attachment-path: ${EMAIL_ATTACHMENT_PATH:temp/email-attachments}
    max-attachment-size-mb: ${EMAIL_MAX_ATTACHMENT_SIZE_MB:10}
    log-retention-days: ${EMAIL_LOG_RETENTION_DAYS:90}

  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    resend-limit-seconds: ${OTP_RESEND_LIMIT_SECONDS:60}
    count-ttl-hours: ${OTP_COUNT_TTL_HOURS:24}
    max-send-per-day: ${OTP_MAX_SEND_PER_DAY:10}

  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

  outbox:
    poll-interval: ${APP_OUTBOX_POLL_INTERVAL:5000}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:50}
    lock-duration-seconds: ${APP_OUTBOX_LOCK_DURATION_SECONDS:120}
    publish-confirm-timeout-seconds: ${APP_OUTBOX_PUBLISH_CONFIRM_TIMEOUT_SECONDS:5}

  rabbitmq:
    stomp:
      host: ${RABBITMQ_STOMP_HOST:${RABBITMQ_HOST:localhost}}
      port: ${RABBITMQ_STOMP_PORT:61613}
      username: ${RABBITMQ_STOMP_USERNAME:${RABBITMQ_DEFAULT_USER:admin}}
      password: ${RABBITMQ_STOMP_PASSWORD:${RABBITMQ_DEFAULT_PASS:admin123}}
      virtual-host: ${RABBITMQ_STOMP_VHOST:${RABBITMQ_VHOST:/}}
      heartbeat-send-interval: ${RABBITMQ_STOMP_HEARTBEAT_SEND_INTERVAL:10000}
      heartbeat-receive-interval: ${RABBITMQ_STOMP_HEARTBEAT_RECEIVE_INTERVAL:10000}

    domain-events:
      exchange: ${APP_RABBITMQ_DOMAIN_EVENTS_EXCHANGE:demo.domain-events.exchange}
      queue: ${APP_RABBITMQ_DOMAIN_EVENTS_QUEUE:demo.queue.domain-events.queue}
      retry-queue: ${APP_RABBITMQ_DOMAIN_EVENTS_RETRY_QUEUE:demo.queue.domain-events.retry.queue}
      dlq: ${APP_RABBITMQ_DOMAIN_EVENTS_DLQ:demo.queue.domain-events.dlq}
      routing-key: "${APP_RABBITMQ_DOMAIN_EVENTS_ROUTING_KEY:demo.events.#}"
      retry-routing-key: ${APP_RABBITMQ_DOMAIN_EVENTS_RETRY_ROUTING_KEY:demo.events.retry}
      dlq-routing-key: ${APP_RABBITMQ_DOMAIN_EVENTS_DLQ_ROUTING_KEY:demo.events.failed}
      retry-ttl-ms: ${APP_RABBITMQ_DOMAIN_EVENTS_RETRY_TTL_MS:30000}
      concurrent-consumers: ${APP_RABBITMQ_DOMAIN_EVENTS_CONCURRENT_CONSUMERS:2}
      max-consumers: ${APP_RABBITMQ_DOMAIN_EVENTS_MAX_CONSUMERS:6}
      prefetch: ${APP_RABBITMQ_DOMAIN_EVENTS_PREFETCH:10}

    email:
      exchange: ${APP_RABBITMQ_EMAIL_EXCHANGE:demo.email.exchange}
      queue: ${APP_RABBITMQ_EMAIL_QUEUE:demo.email.queue}
      retry-queue: ${APP_RABBITMQ_EMAIL_RETRY_QUEUE:demo.email.retry.queue}
      dlq: ${APP_RABBITMQ_EMAIL_DLQ:demo.email.dlq}
      routing-key: ${APP_RABBITMQ_EMAIL_ROUTING_KEY:demo.email.send}
      retry-routing-key: ${APP_RABBITMQ_EMAIL_RETRY_ROUTING_KEY:demo.email.retry}
      dlq-routing-key: ${APP_RABBITMQ_EMAIL_DLQ_ROUTING_KEY:demo.email.failed}
      retry-ttl-ms: ${APP_RABBITMQ_EMAIL_RETRY_TTL_MS:30000}
      concurrent-consumers: ${APP_RABBITMQ_EMAIL_CONCURRENT_CONSUMERS:3}
      max-consumers: ${APP_RABBITMQ_EMAIL_MAX_CONSUMERS:10}
      prefetch: ${APP_RABBITMQ_EMAIL_PREFETCH:1}

    background-job:
      exchange: ${APP_RABBITMQ_BACKGROUND_JOB_EXCHANGE:demo.background-job.exchange}
      queue: ${APP_RABBITMQ_BACKGROUND_JOB_QUEUE:demo.background-job.queue}
      retry-queue: ${APP_RABBITMQ_BACKGROUND_JOB_RETRY_QUEUE:demo.background-job.retry.queue}
      dlq: ${APP_RABBITMQ_BACKGROUND_JOB_DLQ:demo.background-job.dlq}
      routing-key: ${APP_RABBITMQ_BACKGROUND_JOB_ROUTING_KEY:demo.background-job.process}
      retry-routing-key: ${APP_RABBITMQ_BACKGROUND_JOB_RETRY_ROUTING_KEY:demo.background-job.retry}
      dlq-routing-key: ${APP_RABBITMQ_BACKGROUND_JOB_DLQ_ROUTING_KEY:demo.background-job.failed}
      retry-ttl-ms: ${APP_RABBITMQ_BACKGROUND_JOB_RETRY_TTL_MS:60000}
      concurrent-consumers: ${APP_RABBITMQ_BACKGROUND_JOB_CONCURRENT_CONSUMERS:2}
      max-consumers: ${APP_RABBITMQ_BACKGROUND_JOB_MAX_CONSUMERS:4}
      prefetch: ${APP_RABBITMQ_BACKGROUND_JOB_PREFETCH:1}
      export-folder: ${BACKGROUND_JOB_EXPORT_FOLDER:background-jobs/exports}

    order-expiry:
      exchange: ${APP_RABBITMQ_ORDER_EXPIRY_EXCHANGE:demo.order-expire.exchange}
      queue: ${APP_RABBITMQ_ORDER_EXPIRY_QUEUE:demo.order-expire.queue}
      routing-key: ${APP_RABBITMQ_ORDER_EXPIRY_ROUTING_KEY:order.expire}
